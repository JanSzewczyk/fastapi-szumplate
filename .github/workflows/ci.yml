name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # new advisories appear without a new commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: make check
      - run: make audit
