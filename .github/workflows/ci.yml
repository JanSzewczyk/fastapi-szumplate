name: ci

# Pushes to main and pull requests; a branch without a pull request runs CI from the Actions tab
# (workflow_dispatch). Running on every push too would test each pull request commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # new advisories appear without a new commit

permissions:
  contents: read

# The event is part of the group, so the weekly run never cancels a push to main or the other way
# round; only a newer commit of the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"

# Actions are pinned to a commit; Dependabot bumps the hash and the version comment together.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: make check
      - name: Coverage summary
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - run: make audit

  # Contract tooling: Spectral on the spec, oasdiff against main, Schemathesis against a live server.
  api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # api-breaking reads origin/main:openapi.json
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --group api
      - run: make api-check

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: . # the checkout, so .dockerignore applies as in a local build
          load: true
          tags: fastapi-szumplate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and wait until its own HEALTHCHECK reports healthy
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp fastapi-szumplate:ci
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' api)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          # Docker's port proxy accepts the connection before the app listens and then resets it
          # (curl exit 56), which `--retry-connrefused` does not retry; `--retry-all-errors` does.
          if [ "$status" != healthy ] || ! curl --silent --show-error --fail --retry 5 --retry-delay 2 \
            --retry-all-errors http://127.0.0.1:8000/health; then
            echo "health status: $status"
            docker logs api
            exit 1
          fi
          docker logs api
          docker stop api
      # compose.yaml drops every capability and sets no-new-privileges, which `docker run` above
      # does not, so it is started and called on its own. `--wait` waits for the image HEALTHCHECK.
      - name: Start the compose service and call the health endpoint
        run: |
          docker compose config --quiet
          if ! docker compose up -d --build --wait --wait-timeout 90 \
            || ! curl --silent --show-error --fail --retry 15 --retry-delay 2 --retry-all-errors \
              http://127.0.0.1:8000/health; then
            docker compose logs
            exit 1
          fi
      - name: Stop the compose service
        if: always()
        run: docker compose down

  # begin:template
  # Proves that a project made from the template passes its own `make check`, with and without
  # the example. The same script runs locally as `make smoke-template`.
  template-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: ["", "--rename-only"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: scripts/smoke_template.sh ${{ matrix.variant }}

  # end:template
  # Informational: the free-threaded build exposes races the GIL hides. Never blocks a merge.
  free-threaded:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python 3.15t
      - run: uv run --python 3.15t pytest
