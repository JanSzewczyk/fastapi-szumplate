name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # new advisories appear without a new commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: make check
      - run: make audit

  # Contract tooling: Spectral on the spec, oasdiff against main, Schemathesis against a live server.
  api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # api-breaking reads origin/main:openapi.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --group api
      - run: make api-check

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fastapi-szumplate:ci .
      - name: Start the container and call the health endpoint
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp fastapi-szumplate:ci
          curl --silent --fail --retry 15 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8000/health
          docker logs api
          docker stop api

  # Proves a copy of the template still passes `make check` after rename and removing the example.
  template-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Copy the template and initialise a project without the example
        run: |
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE"
          git ls-files -z | xargs -0 cp --parents -t "$SMOKE"
          cd "$SMOKE"
          uv run --no-project python scripts/init_project.py orders-api --without-example
          echo "SMOKE=$SMOKE" >> "$GITHUB_ENV"
      - run: uv sync --locked
        working-directory: ${{ env.SMOKE }}
      - run: make openapi
        working-directory: ${{ env.SMOKE }}
      - run: make check
        working-directory: ${{ env.SMOKE }}

  # Informational: the free-threaded build exposes races the GIL hides. Never blocks a merge.
  free-threaded:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python 3.15t
      - run: uv run --python 3.15t pytest
