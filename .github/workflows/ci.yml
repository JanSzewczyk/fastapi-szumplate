name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # new advisories appear without a new commit

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make check
      - run: make audit
